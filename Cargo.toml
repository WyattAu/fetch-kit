[package]
name = "fetch-kit"
version = "0.1.4"
edition = "2024"
rust-version = "1.85"
description = "Resilient HTTP client for Rust — retry, circuit breaker, connection pooling, and typed JSON helpers built on reqwest"
license = "MIT OR Apache-2.0"
repository = "https://github.com/WyattAu/fetch-kit"
keywords = ["http", "reqwest", "retry", "circuit-breaker", "resilient"]
categories = ["network-programming", "web-programming"]
exclude = ["/target"]

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["form", "query"] }
reqwest-middleware = { version = "0.5", features = ["json", "multipart", "form", "query"] }
reqwest-retry = "0.9"
serde = "1"
serde_json = "1"
thiserror = "2"
http = "1"
async-trait = "0.1"
anyhow = "1"

breaker = { version = "1", git = "https://github.com/WyattAu/breaker", optional = true }

[dev-dependencies]
proptest = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }
serde = { version = "1", features = ["derive"] }
criterion = { version = "0.5", features = ["html_reports"] }
# Wire-level integration tests (tests/wire.rs): a real HTTP server on loopback.
wiremock = "0.6"


[features]
default = ["json", "rustls-tls"]
json = ["reqwest/json", "reqwest-middleware/json"]
multipart = ["reqwest/multipart", "reqwest-middleware/multipart"]
rustls-tls = ["reqwest/rustls"]
native-tls = ["reqwest/native-tls"]
circuit-breaker = ["dep:breaker"]

[[bench]]
name = "fetch_kit_bench"
harness = false

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
