[package]
name = "fetch-kit"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Resilient HTTP client for Rust — retry, circuit breaker, connection pooling, and typed JSON helpers built on reqwest"
license = "MIT OR Apache-2.0"
repository = "https://github.com/WyattAu/fetch-kit"
keywords = ["http", "reqwest", "retry", "circuit-breaker", "resilient"]
categories = ["network-programming", "web-programming"]
exclude = ["/target"]

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["form", "query"] }
serde = "1"
serde_json = "1"
thiserror = "2"
http = "1"
async-trait = "0.1"
url = "2"

# Estate loop-retry: exponential backoff + jitter semantics for RetryMiddleware.
loop-retry = "0.1.1"

# Time is needed by the bundled throttle/timeout middleware (retry gets its
# sleeping from loop-retry itself).
tokio = { version = "1", default-features = false, features = ["time"], optional = true }

breaker = { version = "1.0", optional = true }

[dev-dependencies]
proptest = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }
serde = { version = "1", features = ["derive"] }
criterion = { version = "0.5", features = ["html_reports"] }
http = "1"
# Wire-level integration tests (tests/wire.rs): a real HTTP server on loopback.
wiremock = "0.6"


[features]
default = ["json", "rustls-tls", "retry"]
json = ["reqwest/json"]
multipart = ["reqwest/multipart"]
rustls-tls = ["reqwest/rustls"]
native-tls = ["reqwest/native-tls"]
circuit-breaker = ["dep:breaker"]
# Bundled middleware. The core `Middleware` trait + `ClientWithMiddleware`
# chain are always available; these gate only the implementations.
retry = []
throttle = ["dep:tokio"]
timeout = ["dep:tokio"]
base-url = []

[[bench]]
name = "fetch_kit_bench"
harness = false

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[package.metadata.layers]
tier = "L3"
